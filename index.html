<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nytsai's Piano Sheets &amp; Works</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="smooth-wrapper">
    <div id="smooth-content">
      <div id="stage">
        <canvas id="grid" aria-hidden="true"></canvas>
        <div class="hero" id="hero">
          <h1>Nytsai's Piano Sheets &amp; Works</h1>
          <p class="hero-links">
            <a href="#">Bilibili</a><span class="sep">|</span><a href="#">小红书</a><span class="sep">|</span><a href="#">Youtube</a><span class="sep">|</span><a href="#">X</a>
          </p>
        </div>
        <div class="hint" id="hint" aria-hidden="true">
          <span class="hint-inner">
            <svg viewBox="0 0 12 8" width="11" height="8">
              <path d="M6 7.2L0.8 0.8h10.4L6 7.2z" fill="currentColor" />
            </svg>
          </span>
        </div>
        <div id="about-score">
          <div id="score"></div>
          <p class="score-caption"><em>Ripples of Past Reverie</em> by Nagiha</p>
        </div>
        <div id="about-copy">
          <h2>你猜这个人</h2>
          <p class="about-sub">Nytsai</p>
          <hr class="about-rule" />
          <div class="about-body">
            <p class="lead"><span>绘谱雕版师</span><span>东京艺术大学作曲科毕业</span></p>
            <p>从大学在学期间开始，便在大型乐谱出版社从事乐谱制作工作，并于2017年独立。</p>
            <p>专门从事绘谱雕版、乐谱编辑、校对与审阅、DTP等版面制作工作。</p>
          </div>
        </div>
        <section id="works" class="page-title"><h2>作品</h2></section>
        <section id="service" class="page-title"><h2>服务</h2></section>
        <section id="contact" class="page-title"><h2>联系</h2></section>
        <nav id="wheel" aria-label="目录">
          <svg class="wheel-bg" viewBox="0 0 192 544" preserveAspectRatio="none" aria-hidden="true">
            <path d="" />
          </svg>
          <div class="wheel-inner">
            <button class="wheel-item" type="button" data-page="0"><span class="zh">主页</span><span class="en">Home</span></button>
            <button class="wheel-item" type="button" data-page="1"><span class="zh">简介</span><span class="en">About</span></button>
            <button class="wheel-item" type="button" data-page="2"><span class="zh">作品</span><span class="en">Works</span></button>
            <button class="wheel-item" type="button" data-page="3"><span class="zh">服务</span><span class="en">Service</span></button>
            <button class="wheel-item" type="button" data-page="4"><span class="zh">联系</span><span class="en">Contact</span></button>
          </div>
        </nav>
        <p class="copyright">Copyright © 2026 Nytsai Piano Sheets</p>
      </div>
    </div>
  </div>

  <script src="score-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollSmoother.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/score.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
